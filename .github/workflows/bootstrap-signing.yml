# One-time bootstrap: generates a keystore inside CI and writes the signing
# secrets back to the repository via the GitHub API. Nothing sensitive is
# ever printed to the log or uploaded as an artifact; the keystore only ever
# exists on the runner's filesystem and inside encrypted GitHub Secrets.
#
# Prerequisite: repo Settings -> Actions -> General -> Workflow permissions
# must allow "Read and write permissions" (or a PAT with secrets:write).
#
# Run manually from the Actions tab, then DELETE the workflow file in the
# same commit series (it is guarded against re-running by the marker check).

name: Bootstrap Signing Secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to run if secrets already exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if gh secret list --repo "$GITHUB_REPOSITORY" | grep -q KEYSTORE_BASE64; then
            echo "KEYSTORE_BASE64 already exists; refusing to overwrite. Delete the secret first if you really want to rotate."
            exit 1
          fi

      - name: Install JDK (keytool)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore and write secrets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          WORK=$(mktemp -d)
          trap 'rm -rf "$WORK"' EXIT

          KS_PASS=$(openssl rand -base64 24 | tr -d '/+=' )
          # PKCS12 keystores (keytool default) share one password for store
          # and key; use the same value for both.
          KEY_PASS="$KS_PASS"
          ALIAS="zeniquill"

          keytool -genkeypair \
            -keystore "$WORK/zeniquill.jks" \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass "$KS_PASS" -keypass "$KEY_PASS" \
            -dname "CN=Xiaoao, OU=ZeniQuill, O=ZeniQuill, C=CN"

          base64 -w0 "$WORK/zeniquill.jks" > "$WORK/ks.b64"

          gh secret set KEYSTORE_BASE64 --repo "$GITHUB_REPOSITORY" < "$WORK/ks.b64"
          gh secret set KEYSTORE_PASSWORD --repo "$GITHUB_REPOSITORY" --body "$KS_PASS"
          gh secret set KEY_PASSWORD     --repo "$GITHUB_REPOSITORY" --body "$KEY_PASS"
          gh secret set KEY_ALIAS        --repo "$GITHUB_REPOSITORY" --body "$ALIAS"

          # Verify the keystore decrypts and the key is present, without
          # printing any secret material.
          base64 -d "$WORK/ks.b64" > "$WORK/check.jks"
          keytool -list -keystore "$WORK/check.jks" -storepass "$KS_PASS" \
            | grep -q "PrivateKeyEntry" && echo "OK: keystore verified, secrets written"

      - name: Summary
        run: |
          echo "### Signing secrets written" >> "$GITHUB_STEP_SUMMARY"
          echo "KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_PASSWORD / KEY_ALIAS are now set." >> "$GITHUB_STEP_SUMMARY"
          echo "**Back up the secrets now** (they cannot be recovered if lost):" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "gh secret list --repo $GITHUB_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Then delete this workflow file to avoid accidental re-runs." >> "$GITHUB_STEP_SUMMARY"
